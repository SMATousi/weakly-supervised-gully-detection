name: mistral-small-3.2-24b-fp8_sq_collage
model: mistralai/Mistral-Small-3.2-24B-Instruct-2506   # bf16 checkpoint quantized to fp8 on load (~24 GB)
revision: null            # pin the HF commit sha before a full-pool run
tp: 2
max_model_len: 6144
gpu_mem_util: 0.95
dtype: bfloat16
llm_kwargs: {enforce_eager: true, quantization: fp8, tokenizer_mode: mistral, config_format: mistral, load_format: mistral}
image_url_parts: true   # mistral-common takes image_url data URLs
image_mode: collage     # 4x2 grid with years, 1200x600
naip_size: 224
highres_size: 672
prompt_file: configs/prompts/single_question.yaml
prompt_id: sq_v4
seed: 0
