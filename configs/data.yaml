# Data locations on Nautilus (namespace gpn-mizzou-vigir). Verified 2026-10-22 with cluster/pvc_inspect_pod.yaml.
# kubectl needs the krew plugin on PATH: export PATH="$HOME/.krew/bin:$PATH"
pvc_pool: ali-vol-500g
pool_root: large_unlabeled_dataset          # on ali-vol-500g
pool:
  rgb_images: large_unlabeled_dataset/rgb_images    # 145,432 files = 18,179 locations x 8 (rgb_0..6, rgb_highres)
  dem: large_unlabeled_dataset/dem                  # dem_tile_{id}.tif, all 18,179 pool locations
  ground_truth: large_unlabeled_dataset/ground_truth  # negative_ground_truth_tile_{id}.tif (18,179)
pvc_test: ali-vol-1tera
test:
  root: other-pvcs/final_pos_neg_test_data_merging_25_2   # all_tiles/, pos/, neg/
  rgb_images: other-pvcs/final_pos_neg_test_data_merging_25_2/all_tiles  # 548 locations x 8 (rgb_0..6, rgb_11 = high-res)
# Other copies (do not use): ali-vol-1tera/other-pvcs/large_unlabeled_dataset (root-only perms),
# large_data.tar.gz, A2*, ali-vol-500g/test_data_8_images.tar.gz (not gzip; unreadable as .tar.gz).

# Split design (decisions D-1, D-2; see spec/03-experiments.md)
split:
  seed: 0
  design: fixed_dev_test
  dev_fraction: 0.31          # ~150 of 484
  block_size_m: 1000          # spatial blocks assigned whole to one split
  exclusion_buffer_m: 256     # 2 tile widths (128 px at 1 m); pool locations this close to dev/test are excluded
image_roles:
  naip: [0, 1, 2, 3, 4, 5, 6]   # rgb_i = NAIP bin starting 2010+2i (Earth Engine filter [2010+2i, 2012+2i)); the old collage labels them 2010..2022
  naip_years: [2010, 2012, 2014, 2016, 2018, 2020, 2022]
  highres_year: 2023
  pool_highres: rgb_highres
  test_highres: rgb_11
