# Short-lived CPU pod to find the data on the user's PVCs (read-only). Delete when done.
apiVersion: v1
kind: Pod
metadata:
  name: gully-pvc-inspect
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: python:3.11-slim
      command: ["bash", "-c", "sleep 3600"]
      resources:
        limits: {cpu: "2", memory: 4Gi}
        requests: {cpu: "2", memory: 4Gi}
      volumeMounts:
        - {name: v1t, mountPath: /pvc/ali-vol-1tera, readOnly: true}
        - {name: v500, mountPath: /pvc/ali-vol-500g, readOnly: true}
  volumes:
    - name: v1t
      persistentVolumeClaim: {claimName: ali-vol-1tera, readOnly: true}
    - name: v500
      persistentVolumeClaim: {claimName: ali-vol-500g, readOnly: true}
