# GPU job: frozen FlexiViT-S features for all 18,727 locations -> /pvc/ali-vol-500g/gully/features/flexivit_s.
# Any GPU (ViT-S is small; user-approved for this job only). Runs a 64-location smoke test first, then the full run.
# Needs code staged by cluster/gully_work_pod.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: gully-extract-features
spec:
  backoffLimit: 6   # some nodes fail admission (e.g. a lost GPU); retry elsewhere
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [k8s-haosu-12.sdsc.optiputer.net, nautilus-ext-gpu01.fullerton.edu]   # broken GPUs: reject pods at admission (2026-10-22/23)
      containers:
        - name: extract
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          workingDir: /pvc/ali-vol-500g/gully/code
          command: ["bash", "-c"]
          args:
            - |
              set -e
              (apt-get update -qq && apt-get install -y -qq libexpat1) >/dev/null 2>&1 || true
              pip install -q timm rasterio pandas pyarrow scipy scikit-learn pyyaml
              pip install -q -e . --no-deps
              ARGS="--index artifacts/index/locations.parquet --pvc-root ali-vol-500g=/pvc/ali-vol-500g --pvc-root ali-vol-1tera=/pvc/ali-vol-1tera --out /pvc/ali-vol-500g/gully/features --workers 16 --batch-size 16"
              python scripts/extract_features.py $ARGS --tag flexivit_s_smoke --limit 64
              python scripts/extract_features.py $ARGS --tag flexivit_s
          resources:
            limits: {nvidia.com/gpu: 1, cpu: "12", memory: 14Gi}
            requests: {cpu: "8", memory: 10Gi}
          volumeMounts:
            - {name: v500, mountPath: /pvc/ali-vol-500g}
            - {name: v1t, mountPath: /pvc/ali-vol-1tera, readOnly: true}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: v500
          persistentVolumeClaim: {claimName: ali-vol-500g}
        - name: v1t
          persistentVolumeClaim: {claimName: ali-vol-1tera, readOnly: true}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
